name: .NET CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/backend.Tests/backend.Tests.csproj

      - name: Build
        run: dotnet build tests/backend.Tests/backend.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/backend.Tests/backend.Tests.csproj --configuration Release --no-build --verbosity normal
